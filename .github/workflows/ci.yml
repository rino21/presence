name: Build and Deploy

on:
  push:
    branches:
      - main
      - develop

jobs:

  changes:
    runs-on: ubuntu-latest
    outputs:
      front-dev: ${{ steps.filter.outputs.front-dev }}
      api-dev: ${{ steps.filter.outputs.api-dev }}
      ci-dev: ${{ steps.filter.outputs.ci-dev }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            front-dev:
              - 'presence-front/**'
            api-dev:
              - 'presence-api/**'
            ci-dev:
              - '.github/workflows/ci.yml'

  ##############################
  # Build Front
  ##############################

  build_front_dev:
    needs: changes
    
    if: github.ref == 'refs/heads/main' && (needs.changes.outputs.front-dev == 'true' || needs.changes.outputs.ci-dev == 'true')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Login Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.TOKEN_GITHUB }}

      - name: Build and Push Front
        uses: docker/build-push-action@v6
        with:
          context: ./presence-front
          file: ./presence-front/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/staging/front:dev

  ##############################
  # Build API
  ##############################

  build_api_dev:

    needs: changes
    if: github.ref == 'refs/heads/main' && (needs.changes.outputs.api-dev == 'true' || needs.changes.outputs.ci-dev == 'true')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.TOKEN_GITHUB }}

      - uses: docker/build-push-action@v6
        with:
          context: ./presence-api
          file: ./presence-api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/staging/api:dev


